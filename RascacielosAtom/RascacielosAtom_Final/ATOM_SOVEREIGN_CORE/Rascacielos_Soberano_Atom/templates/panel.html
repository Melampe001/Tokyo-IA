<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.2/dist/terminal.min.css" />
    <link rel="stylesheet" href="/static/style.css">
    <title>ATOM MASTER CORE</title>
</head>
<body class="terminal">
    <div class="container">
        <header><h1 class="glow">CENTRO DE MANDO: NEXUS-1</h1></header>
        <div class="terminal-alert terminal-alert-primary">ESTADO: {{ status }}</div>
        <div class="terminal-card">
            <header>BÓVEDA SOBERANA (P7)</header>
            <div class="balance">TOTAL ACUMULADO: <mark class="glow-text">$ {{ balance }} USD</mark></div>
        </div>
        <pre><code>> Router modular: OK [Solución 404]
> Seguridad CORS: ACTIVE [Sugerencia 3]
> Monetización: ASYNC READY [Sugerencia 2]</code></pre>
    </div>
</body>
</html>
