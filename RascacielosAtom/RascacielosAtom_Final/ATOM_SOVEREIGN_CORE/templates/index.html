<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.2/dist/terminal.min.css" />
    <link rel="stylesheet" href="/static/style.css">
    <title>ATOM | NEXUS-1</title>
</head>
<body class="terminal">
    <div class="container">
        <header><h1 class="glow">NEXUS-1: SISTEMA OPERATIVO SOBERANO</h1></header>
        <div class="terminal-alert terminal-alert-primary">ESTADO: {{ status }}</div>
        <div class="terminal-card">
            <header>BÓVEDA DE SEGURIDAD (P7)</header>
            <div class="balance-box">SALDO TOTAL: <mark class="glow-text">$ {{ balance }} USD</mark></div>
        </div>
        <pre><code>> Router Modular: OK [Solución 404]
> Background Tasks: READY [Monetización]
> CORS Security: ACTIVE [Acceso Global]</code></pre>
    </div>
</body>
</html>
