<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.2/dist/terminal.min.css" />
    <link rel="stylesheet" href="/static/style.css">
    <title>ATOM | NEXUS-1</title>
</head>
<body class="terminal">
    <div class="container">
        <header><h1 class="glow">NEXUS-1: SISTEMA OPERATIVO SOBERANO</h1></header>
        <div class="terminal-card">
            <header>BÓVEDA DE SEGURIDAD (P7)</header>
            <div class="balance">SALDO TOTAL: <mark class="glow-text">$ {{ balance }} USD</mark></div>
        </div>
        <div class="terminal-card">
            <header>MONITOR DE PROCESOS</header>
            <pre><code>> Router Modular: OK (Solución 404)
> Tareas Segundo Plano: LISTO (Monetización)
> Seguridad CORS: ACTIVA (Estándar Mundial)</code></pre>
        </div>
    </div>
</body>
</html>
