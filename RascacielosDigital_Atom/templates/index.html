<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.2/dist/terminal.min.css" />
    <link rel="stylesheet" href="/static/style.css">
    <title>ATOM | Rascacielos Digital</title>
</head>
<body class="terminal">
    <div class="container">
        <header class="terminal-nav">
            <div class="terminal-logo">
                <div class="logo terminal-prompt"><a href="#" class="no-style">NEXUS-1_GATEWAY</a></div>
            </div>
        </header>
        <main>
            <h1 class="glow">RASCACIELOS DIGITAL ATOM</h1>
            <div class="terminal-alert terminal-alert-primary">ESTADO DEL SISTEMA: {{ status }}</div>
            <div class="terminal-card">
                <header>BÓVEDA DE SEGURIDAD (PISO 7)</header>
                <div>
                    <p>SALDO SOBERANO ACUMULADO: <mark class="glow-text">$ {{ balance }} USD</mark></p>
                </div>
            </div>
            <hr>
            <div class="terminal-card">
                <header>LOGS DE OPERACIÓN OMNI-DAEMON</header>
                <pre><code>> Ejecutando ciclo de ingresos...
> Verificando persistencia atómica...
> Liquidación en curso...</code></pre>
            </div>
        </main>
    </div>
</body>
</html>
