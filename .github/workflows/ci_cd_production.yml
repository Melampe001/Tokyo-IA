name: TokyoApps Technologics Global CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre_flight_check:
    runs-name: Check de Pre-Vuelo Inmaculado Tier 1
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar Única Fuente de Verdad (SSoT)
      uses: actions/checkout@v4

    - name: Inicializar Motor de Producción Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependencias de Alta Concurrencia
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn python-dotenv pydantic aiohttp aiodns

    - name: Ejecutar Auditoría Estática de Sintaxis (0% Entropía)
      run: |
        # Forzar escaneo sintáctico nativo de los conectores financieros unificados
        python -m py_compile internal/integration/nexus_connectors.py
        python -m py_compile internal/integration/okx_connector.py
        python -m py_compile internal/integration/api_gateway.py
        echo "✅ [Pre-Vuelo OK] Código libre de anomalías sintácticas. Calificado para Producción Mundial."