version: '3.8'

services:
  nulogic-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nulogic_core_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; exit(0 if os.path.exists('AGENTS_CORE/phase_sync.py') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rascacielos_net

networks:
  rascacielos_net:
    driver: bridge